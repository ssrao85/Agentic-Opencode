<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Deployed Apps</title>
<style>
  :root {
    --bg: #f6f6f5; --card: #ffffff; --border: #e2e2df; --text: #1c1c1a; --muted: #6b6b66;
    --btn: #ffffff; --btn-hover: #f0f0ee; --green: #1f9d55; --grey: #9a9a95; --danger: #c0392b;
    --focus: #3b6ee8;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #161616; --card: #1e1e1e; --border: #333331; --text: #ededeb; --muted: #9b9b96;
      --btn: #232323; --btn-hover: #2c2c2c; --green: #3ccf7a; --grey: #8a8a85; --danger: #ef6b5b;
      --focus: #7aa2ff;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 14px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif; }
  main { max-width: 1200px; margin: 0 auto; padding: 32px 16px 48px; }
  h1 { font-size: 26px; font-weight: 650; margin: 0 0 4px; }
  .subtitle { color: var(--muted); margin: 0 0 24px; }
  .toolbar { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; margin-bottom: 20px; }
  .search { flex: 1 1 260px; display: flex; align-items: center; gap: 8px; height: 40px; padding: 0 12px;
    border: 1px solid var(--border); border-radius: 8px; background: var(--card); }
  .search svg { flex: none; color: var(--muted); }
  .search input { flex: 1; min-width: 0; border: 0; outline: 0; background: transparent; color: inherit; font: inherit; }
  select { height: 40px; padding: 0 10px; border: 1px solid var(--border); border-radius: 8px;
    background: var(--card); color: inherit; font: inherit; }
  .count { color: var(--muted); white-space: nowrap; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 420px), 1fr)); gap: 16px; }
  .card { display: flex; flex-direction: column; gap: 14px; padding: 20px; border: 1px solid var(--border);
    border-radius: 14px; background: var(--card); }
  .head { display: flex; justify-content: space-between; gap: 12px; align-items: flex-start; }
  .name { font-size: 17px; font-weight: 650; margin: 0; overflow-wrap: anywhere; }
  .path { color: var(--muted); font-size: 13px; overflow-wrap: anywhere; }
  .status { display: flex; align-items: center; gap: 6px; white-space: nowrap; color: var(--muted); }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--grey); }
  .running .dot { background: var(--green); box-shadow: 0 0 0 3px color-mix(in srgb, var(--green) 25%, transparent); }
  .running .status { color: var(--text); }
  .meta { display: flex; flex-wrap: wrap; gap: 4px 20px; font-size: 13px; }
  .meta span b { font-weight: 500; color: var(--muted); }
  .auto { display: flex; align-items: center; gap: 8px; width: fit-content; cursor: pointer; }
  .auto input { width: 16px; height: 16px; margin: 0; accent-color: var(--green); }
  .actions { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  .btn { display: inline-flex; align-items: center; gap: 6px; height: 34px; padding: 0 14px; border: 1px solid var(--border);
    border-radius: 8px; background: var(--btn); color: inherit; font: inherit; text-decoration: none; cursor: pointer; }
  .btn:hover:not([aria-disabled="true"]):not(:disabled) { background: var(--btn-hover); }
  .btn:disabled, .btn[aria-disabled="true"] { opacity: .45; cursor: not-allowed; pointer-events: none; }
  .btn.danger { color: var(--danger); border-color: color-mix(in srgb, var(--danger) 45%, var(--border)); }
  .btn:focus-visible, select:focus-visible, .auto input:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
  .confirm { color: var(--muted); font-size: 13px; }
  .empty, .error { padding: 40px 16px; text-align: center; color: var(--muted); border: 1px dashed var(--border); border-radius: 14px; }
  .toast { position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%); max-width: calc(100% - 32px);
    padding: 10px 16px; border-radius: 8px; background: var(--danger); color: #fff; display: none; }
  .toast.show { display: block; }
  code { font-size: 12.5px; }
</style>
</head>
<body>
<main>
  <h1>Deployed Apps</h1>
  <p class="subtitle">Web apps deployed in this environment, served through opencode under <code>/apps/&lt;name&gt;/</code>.</p>

  <div class="toolbar">
    <label class="search">
      <svg width="16" height="16" viewBox="0 0 16 16" fill="none" aria-hidden="true"><circle cx="7" cy="7" r="4.75" stroke="currentColor" stroke-width="1.5"/><path d="M10.5 10.5L14 14" stroke="currentColor" stroke-width="1.5"/></svg>
      <input id="search" type="search" placeholder="Search apps" aria-label="Search apps">
    </label>
    <select id="status" aria-label="Filter by status">
      <option value="all">All statuses</option>
      <option value="running">Running</option>
      <option value="stopped">Stopped</option>
    </select>
    <span class="count" id="count"></span>
  </div>

  <div id="list" aria-live="polite"></div>
</main>
<div class="toast" id="toast" role="alert"></div>

<template id="card">
  <article class="card">
    <div class="head">
      <div>
        <h2 class="name"></h2>
        <div class="path"></div>
      </div>
      <span class="status"><span class="dot"></span><span class="label"></span></span>
    </div>
    <div class="meta">
      <span><b>Framework:</b> <span class="framework"></span></span>
      <span><b>Port:</b> <span class="port"></span></span>
      <span><b>Deployed</b> <span class="deployed"></span></span>
    </div>
    <label class="auto"><input type="checkbox" class="auto-restart"> Auto-restart</label>
    <div class="actions">
      <a class="btn open" target="_blank" rel="noopener">Open ↗</a>
      <button class="btn toggle" type="button"></button>
      <button class="btn danger remove" type="button">Remove</button>
    </div>
  </article>
</template>

<script>
  // Status changes outside this page (crashes, the `apps` CLI), so keep polling.
  const REFRESH_MS = 5000
  const state = { apps: [], loaded: false, error: "", busy: new Set(), confirming: null }
  const $ = (id) => document.getElementById(id)

  const title = (name) => name.split(/[-_]+/).filter(Boolean).map((w) => w[0].toUpperCase() + w.slice(1)).join(" ")
  const relative = (ms) => {
    if (!ms) return "unknown"
    const s = Math.max(0, (Date.now() - ms) / 1000)
    const steps = [[60, "second", 1], [3600, "minute", 60], [86400, "hour", 3600], [2592000, "day", 86400], [31536000, "month", 2592000], [Infinity, "year", 31536000]]
    const [, unit, size] = steps.find(([limit]) => s < limit)
    if (unit === "second") return "just now"
    return new Intl.RelativeTimeFormat("en", { numeric: "auto" }).format(-Math.floor(s / size), unit)
  }

  async function api(path, options = {}) {
    const res = await fetch("api/apps" + path, { headers: { "content-type": "application/json" }, ...options })
    const body = await res.json().catch(() => ({}))
    if (!res.ok) throw new Error(body.detail || res.statusText)
    return body
  }

  async function refresh() {
    try {
      state.apps = await api("")
      state.error = ""
    } catch (err) {
      state.error = err.message
    }
    state.loaded = true
    render()
  }

  async function act(name, path, options) {
    state.busy.add(name)
    render()
    try {
      await api(path, options)
    } catch (err) {
      toast(err.message)
    }
    state.busy.delete(name)
    await refresh()
  }

  function toast(message) {
    const el = $("toast")
    el.textContent = message
    el.classList.add("show")
    clearTimeout(toast.timer)
    toast.timer = setTimeout(() => el.classList.remove("show"), 5000)
  }

  function render() {
    const query = $("search").value.trim().toLowerCase()
    const status = $("status").value
    const visible = state.apps.filter((a) =>
      (status === "all" || a.status === status) &&
      (!query || a.name.toLowerCase().includes(query) || title(a.name).toLowerCase().includes(query)))
    $("count").textContent = `Showing ${visible.length} of ${state.apps.length}`

    const list = $("list")
    list.replaceChildren()
    if (state.error) return list.append(Object.assign(document.createElement("div"), { className: "error", textContent: state.error }))
    if (!state.loaded) return
    if (!visible.length) {
      return list.append(Object.assign(document.createElement("div"), {
        className: "empty",
        textContent: state.apps.length ? "No apps match your search." : "No apps deployed yet. Ask the agent to build an app and deploy it with `apps deploy <name>`.",
      }))
    }

    const grid = Object.assign(document.createElement("div"), { className: "grid" })
    for (const app of visible) grid.append(card(app))
    list.append(grid)
  }

  function card(app) {
    const node = $("card").content.firstElementChild.cloneNode(true)
    const running = app.status === "running"
    const busy = state.busy.has(app.name)
    node.classList.toggle("running", running)
    node.querySelector(".name").textContent = title(app.name)
    node.querySelector(".path").textContent = app.path
    node.querySelector(".label").textContent = running ? "Running" : "Stopped"
    node.querySelector(".framework").textContent = app.framework || "unknown"
    node.querySelector(".port").textContent = app.port
    node.querySelector(".deployed").textContent = relative(app.deployedAt)

    const auto = node.querySelector(".auto-restart")
    auto.checked = app.autoRestart
    auto.disabled = busy || !app.startable
    auto.onchange = () => act(app.name, `/${app.name}`, { method: "PATCH", body: JSON.stringify({ autoRestart: auto.checked }) })

    const open = node.querySelector(".open")
    open.href = app.path
    if (!running) open.setAttribute("aria-disabled", "true")

    const toggle = node.querySelector(".toggle")
    toggle.textContent = running ? "■ Stop" : "▶ Start"
    toggle.disabled = busy || (!running && !app.startable)
    if (!app.startable) toggle.title = "No start command was recorded. Redeploy it with `apps run`."
    toggle.onclick = () => act(app.name, `/${app.name}/${running ? "stop" : "start"}`, { method: "POST" })

    const remove = node.querySelector(".remove")
    remove.disabled = busy
    if (state.confirming === app.name) {
      const actions = node.querySelector(".actions")
      const note = Object.assign(document.createElement("span"), { className: "confirm", textContent: "Stop and remove? Files are kept." })
      const cancel = Object.assign(document.createElement("button"), { className: "btn", type: "button", textContent: "Cancel" })
      cancel.onclick = () => { state.confirming = null; render() }
      remove.textContent = "Confirm remove"
      remove.onclick = () => { state.confirming = null; act(app.name, `/${app.name}`, { method: "DELETE" }) }
      actions.append(note, cancel)
    } else {
      remove.onclick = () => { state.confirming = app.name; render() }
    }
    return node
  }

  $("search").addEventListener("input", render)
  $("status").addEventListener("change", render)
  refresh()
  setInterval(() => { if (!document.hidden && !state.busy.size) refresh() }, REFRESH_MS)
</script>
</body>
</html>
